name: Build, Test, and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'docs/images/example_original.jpg'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'docs/images/example_original.jpg'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Standalone HTML
        run: python scripts/build.py

      # Also runs tests/test_engine.js
      - name: Verify build and run tests
        run: python scripts/verify.py

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Standalone HTML
        run: python scripts/build.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html Img2Palette.html src/version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated rebuild of index.html and Img2Palette.html [skip ci]"
            git push
          fi

      # index.html is self-contained, so it is the only file the site needs
      - name: Stage site
        run: |
          mkdir _site
          cp index.html _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
